[package]
name = "justsftp"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "An SFTP v3 client over any async byte stream, where a path is bytes, never a String."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/justsftp"
readme = "README.md"
keywords = ["sftp", "ssh", "filetransfer", "async", "tokio"]
categories = ["network-programming", "filesystem", "asynchronous"]
include = ["/src/**", "/tests/**", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/Cargo.toml"]

# tokio only: no SSH dependency, no encoding crate, no serde (docs/map/territory/package-and-release.md).
[dependencies]
# The AsyncRead/AsyncWrite traits, the channels that pair a reply to its request, and `io-util`'s
# `duplex`, the tests' transport.
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros", "test-util"] }
