[package]
name = "justsftp"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "An SFTP v3 client over any async byte stream, where a path is bytes, never a String."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/justsftp"
readme = "README.md"
keywords = ["sftp", "ssh", "filetransfer", "async", "tokio"]
categories = ["network-programming", "filesystem", "asynchronous"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

# No SSH dependency, no encoding crate, no serde — see docs/map/territory/dependency-fence.md.
[dependencies]
# tokio: the AsyncRead/AsyncWrite traits themselves plus the oneshot/Mutex used to pair a reply
# to its request. `io-util` is what `tokio::io::duplex` lives behind, and the duplex pipe is this
# crate's entire test seam — no SSH, no server, no network.
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros", "test-util"] }
