# Publishes the crate to crates.io when a `vX.Y.Z` tag is pushed, through crates.io Trusted
# Publishing: no token is stored; the job trades GitHub's OIDC token for a short-lived crates.io
# token that the auth action revokes when the job ends. Why: docs/map/territory/package-and-release.md.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="justsftp") | .version')"
          echo "tag=$tag crate=$crate"
          test "$tag" = "$crate" || { echo "::error::tag v$tag != crate version $crate"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
